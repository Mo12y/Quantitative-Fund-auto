# 用户画像本地配置 —— **模板**（可入库）
# 用法：复制本文件为 config/user_profile.local.yaml 并填入自己的偏好。
# 该 local 文件已加入 .gitignore，不会进版本库（与 investment_plan.local 同一模式）。
#
# 键与 src/analysis/user_constraint.py 的 PROFILE_KEYS 一一对应；
# **未识别的键会被显式忽略**（如 risk_pref 这类自由文本不做映射 —— 没有经校准的
# "文字→阈值"表，不编造；见 docs/基金推荐系统设计方案.md §4.4）。
#
# ── 组别偏好 ──────────────────────────────────────────────────────
# preferred_groups : 只保留这些参照系组；excluded_groups : 排除这些组
#   六个组别（精确名称）：
#     A 偏股混合 / B 灵活配置 / C 主动股票 / D 指数股票 / E 债券 / F QDII/其他
#
# ── 风险偏好（两套口径可同时用）────────────────────────────────────
# min_percentiles / max_percentiles : 同类百分位下限/上限（0-100，**越大越好**口径；
#   回撤/波动已按方向归一：分越高 = 回撤控制越好）。缺该指标时不猜 → 归"未评估"。
# max_values / min_values : 指标绝对上限/下限，需要候选带 metrics（当前 /api/recommend 已注入）。
#   字段：max_drawdown_1y（%）、ann_vol（%）、annual_return（%）、momentum_3m（%）、sharpe
#   例：max_drawdown_1y: 25 表示"近一年最大回撤不超过 25%"
#
# ── 持仓重叠 ─────────────────────────────────────────────────────
# overlap_max_board_pct : 单个板块在现有持仓中的金额占比上限（%）。默认 40。
#   ⚠️ 这是**用户偏好值**（不是统计阈值）：现有持仓里 半导体/人工智能 各 19.4%、
#   黄金 15.2%、宽基 12.1%（2026-09-26 实测）—— 40% 基本只会拦住"已持有同一只"，
#   想让半导体/AI 触发就用 20%，连黄金一起拦用 15%。
# overlap_exclude_held : 候选就是已持有的同一只是否剔除（默认 true；想加仓某只时设 false）
#
# ── 相关性重叠（"伪分散"）────────────────────────────────────────────
# 两种模式（**不写任何一行 = 该约束不启用**；阈值属统计判断值，不设默认）：
#
# corr_relative : **相对同类基线（推荐，2026-10-01 起）**
#   门限 = clamp(该类对 μ + k·σ, 底线, 上限)。写 `true` 即用默认 k=1.0 / 底线 0.60 / 上限 0.80；
#   也可显式覆盖：corr_relative: {k: 1.0, floor: 0.60, cap: 0.80}
#   为什么：实测绝对阈值不成立 —— 同类基线（1 年窗）本身 0.40~0.85 不等，
#   跨类差异（股票×债 −0.05 vs 股票×海外 0.31）比"0.8 还是 0.7"大得多。
#   底数由 scripts/build_overlap_baselines.py 产出（data/overlap_baselines.json，运行时不入库）。
#   标定依据与对照实测见 docs/审计修复记录.md 第四批 §13。
#
# corr_max_r : **绝对阈值（legacy）**。候选与已持基金近 1 年周收益 r ≥ 该值 → 剔除。
#   两种模式同时写时：相对模式优先，corr_max_r 被忽略（评估说明里会声明）。
#
# ── 温度→权益仓位的枢轴（AQR 式，2026-10-01 起）────────────────────
# equity_neutral_pct / equity_tilt_pp : **长期中性权益目标**与**温度调节幅度**。
#   目标 = 中性 + (50 − 温度)/50 × 幅度（温度 50° 处即中性；0°/100° 处 ±幅度）。
#   ⚠️ 中性目标是**风险偏好、不是数据推出来的** —— 不写 = 用默认 60 / 25。
#   为什么废弃了旧的"5%~70% 由估值决定"：20 年真实温度回测显示按温度降暴露在风险调整后
#   减分（年化 −2.45pp、夏普 0.16 vs 恒定 60% 的 0.26），平均权益只有 40%
#   —— 正对上 AQR"50 多年只收了 89% 的风险溢价"。依据见 docs/审计修复记录.md 第四批 §10-§11。
#   例（保守一点）：equity_neutral_pct: 45 ／ equity_tilt_pp: 20
#
# ── 目标权益仓位（覆盖温度模型）──────────────────────────────────
# target_equity_pct : 直接指定目标权益占比（0-100，单位 %）。**优先级高于上面的枢轴**。
#   ⚠️ 这个键**不属于**上面那组"候选基金过滤约束"（PROFILE_KEYS），它改的是
#   「调仓建议的目标仓位」本身，由 RebalanceAdvisor 读取。
#
#   不写 → 目标由**温度模型**给出（温度越高越减仓，随市场自动变）。
#   写了 → 用你的值，界面会标注目标来源为「我的设定」。
#
#   什么时候该写：当你的风险预期在一段时间内**固定**，不想让温度模型替你调。
#   什么时候别写：想让系统跟着市场自动加减仓 —— 那正是温度模型的用途。
#
#   注意：它只影响**目标**，不影响「当前权益占比」的算法（后者永远只算温度适用的
#   A 股权益，另有 non_applicable_pct 部分不参与判断）。
#   ⚠️ 温度数据完全缺失时本条**不生效**（仍返回"数据不足，暂不给建议"）——
#   原因见 src/analysis/rebalance_advisor.py 里的边界说明，属已知限制。
#
#   例：target_equity_pct: 40

# 下面全是**示例**（不是任何人的真实偏好），按需删改。去掉行首 # 即生效：

# preferred_groups: ['A 偏股混合', 'B 灵活配置', 'C 主动股票', 'D 指数股票']
# excluded_groups: ['F QDII/其他']
# min_percentiles: {max_drawdown_1y: 50}
# max_values: {max_drawdown_1y: 30}
# overlap_max_board_pct: 40
# overlap_exclude_held: true
# corr_max_r: 0.8
# target_equity_pct: 40