<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化基金仪表盘</title>
<link rel="stylesheet" href="/static/app.css?v={{ v }}">
</head>
<body>

<header class="header">
  <h1><span class="mark"></span>量化基金仪表盘</h1>
  <div class="meta">
    <span class="time" id="updateTime">加载中...</span>
    <span class="refresh" onclick="forceRecalc()" title="强制重新计算温度/筛选/调仓并刷新">重算数据</span>
    <span class="refresh" onclick="refresh()">刷新</span>
  </div>
</header>

<div id="toast" role="status" aria-live="polite"></div>

<div class="shell">
  <nav class="sidebar" id="side" aria-label="主导航">
    <div class="g">导航</div>
    <a class="side-a active" id="nav-overview" data-v="overview" href="javascript:void(0)">总览</a>
    <a class="side-a" id="nav-position" data-v="position" href="javascript:void(0)">持仓 · 计划 · 调仓</a>
    <a class="side-a" id="nav-pool" data-v="pool" href="javascript:void(0)">基金筛选池</a>
    <a class="side-a" id="nav-sector" data-v="sector" href="javascript:void(0)">行业板块</a>
    <a class="side-a" id="nav-quant" data-v="quant" href="javascript:void(0)">量化模型</a>
  </nav>

  <main class="main">
    <div class="wrap" id="app">
      <div class="loading"><span class="spinner"></span>正在加载数据...</div>
    </div>
  </main>
</div>

<script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
