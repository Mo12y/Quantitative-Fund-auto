<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化基金仪表盘</title>
<style>
  :root {
    --bg:#0f1117; --card:#1a1d27; --border:#2a2d38; --text:#c9d1d9; --dim:#6e7681;
    --green:#3fb950; --yellow:#d29922; --red:#f85149; --blue:#58a6ff; --cyan:#39d2c0; --purple:#bc8cff;
    --radius:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
  .header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
  .header h1{font-size:18px;font-weight:600}
  .header .time{color:var(--dim);font-size:13px}
  .container{max-width:1200px;margin:0 auto;padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
  .card.full{grid-column:1/-1}
  .card h2{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .card h2 .sub{font-weight:400;font-size:12px;text-transform:none;letter-spacing:0;color:var(--dim)}

  /* Temp */
  .temp-big{font-size:56px;font-weight:700;line-height:1}
  .temp-bar{height:10px;border-radius:5px;background:#21262d;margin:10px 0;overflow:hidden}
  .temp-bar-fill{height:100%;border-radius:5px;transition:width .8s}
  .temp-level{font-size:16px;margin-top:4px}
  .temp-detail{margin-top:10px;font-size:13px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 18px}
  .temp-detail span{white-space:nowrap}

  /* Allocation */
  .alloc-bar{height:28px;border-radius:14px;background:#21262d;overflow:hidden;display:flex;margin:8px 0}
  .alloc-e{background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;transition:width .6s}
  .alloc-b{background:var(--purple);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;transition:width .6s}
  .alloc-legend{display:flex;gap:16px;font-size:12px;color:var(--dim)}

  /* Divergence */
  .divergence{font-size:13px;padding:8px 12px;border-radius:6px;margin-top:10px;background:#1a1d27;border:1px solid var(--border)}
  .style-info{font-size:13px;color:var(--dim);margin-top:8px}
  .style-info b{color:var(--cyan)}

  /* Funds */
  .risk-section{margin-bottom:16px}
  .risk-title{font-size:14px;font-weight:600;margin:8px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
  .fund-row{display:grid;grid-template-columns:72px 1fr 200px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
  .fund-row:last-child{border-bottom:none}
  .fund-code{color:var(--cyan);font-family:monospace;font-size:12px}
  .fund-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .fund-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);justify-content:flex-end}
  .fund-meta .val{font-weight:500;min-width:42px;text-align:right}
  .sparkline{width:48px;height:18px;flex-shrink:0}
  .sparkline svg{width:100%;height:100%}

  /* Badges */
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
  .b-green{background:#1a3a1a;color:var(--green)}
  .b-yellow{background:#3a2e0a;color:var(--yellow)}
  .b-red{background:#3a1010;color:var(--red)}

  /* Alerts */
  .alert{padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px}
  .alert-red{background:#3a1010;border-left:3px solid var(--red)}
  .alert-yellow{background:#3a2e0a;border-left:3px solid var(--yellow)}
  .alert-info{background:#0a1f3a;border-left:3px solid var(--blue)}

  /* Portfolio */
  .pnl-pos{color:var(--green)}
  .pnl-neg{color:var(--red)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot-green{background:var(--green)}
  .empty{color:var(--dim);font-size:13px;padding:16px 0;text-align:center}
  .warn-tag{color:var(--red);font-size:11px;margin-left:2px;white-space:nowrap}

  /* Status row */
  .status{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:8px}

  .refresh{cursor:pointer;color:var(--blue);font-size:13px;user-select:none}
  .refresh:hover{text-decoration:underline}
  .loading{text-align:center;padding:40px;color:var(--dim)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top:2px solid var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
  .summary-bar{display:flex;gap:20px;font-size:12px;color:var(--dim);margin-bottom:10px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="header">
  <h1>📊 量化基金仪表盘</h1>
  <div>
    <span class="time" id="updateTime">加载中...</span>
    <span class="refresh" onclick="loadAll()" style="margin-left:12px">↻ 刷新</span>
  </div>
</div>

<div class="container" id="app">
  <div class="loading"><span class="spinner"></span>正在加载数据...</div>
</div>

<script>
function fmt(v,d=1){return (v??0).toFixed(d)}
function fmtPct(v){return ((v??0)>=0?'+':'')+(v??0).toFixed(2)+'%'}
function fmtMoney(v){return '¥'+(v??0).toLocaleString('zh-CN',{maximumFractionDigits:0})}

function tempMeta(t){
  if(t<=20)return['cold','🧊 极冷','大胆加仓','#58a6ff']
  if(t<=40)return['cool','💧 偏冷','适度加仓','#39d2c0']
  if(t<=60)return['normal','🌤️ 适中','保持定投','#3fb950']
  if(t<=80)return['warm','🔥 偏热','减少买入','#d29922']
  return['hot','☀️ 过热','考虑减仓','#f85149']
}

function sparkSVG(navs, color) {
  if(!navs||navs.length<2)return'<svg viewBox="0 0 48 18"><line x1="0" y1="9" x2="48" y2="9" stroke="#2a2d38" stroke-width="1"/></svg>';
  const vals=navs.map(n=>n.nav);
  const min=Math.min(...vals), max=Math.max(...vals), rng=max-min||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*48},${18-(v-min)/rng*16-1}`);
  return`<svg viewBox="0 0 48 18"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function riskColor(r){return r.includes('稳健')?'var(--green)':r.includes('注意')?'var(--yellow)':'var(--red)';}


async function loadAll(){
  document.getElementById('app').innerHTML='<div class="loading"><span class="spinner"></span>正在加载数据...</div>';
  try{
    const r=await fetch('/api/all');
    const j=await r.json();
    if(!j.ok){document.getElementById('app').innerHTML='<div class="card full"><p style="color:var(--red)">加载失败: '+(j.data?.error||'?')+'</p></div>';return}
    render(j.data);
    document.getElementById('updateTime').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN');
  }catch(e){
    document.getElementById('app').innerHTML='<div class="card full"><p style="color:var(--red)">连接失败: python src/main.py web 在运行吗？</p></div>';
  }
}

function render(d){
  const T=d.temp||{}, F=d.funds||{funds:[],summary:{}}, P=d.portfolio||{}, S=d.sentiment||{}, PL=d.plan||{funds:[]};
  const[tLvl,tIcon,tLabel,tAction,tColor]=tempMeta(T.temperature||50);
  const eq=T.target_equity_pct||35;
  const totalInvested=P.total_invested||1000;

  let html='<div class="grid">';

  // === 温度 ===
  html+=`<div class="card">
    <h2>🌡️ 市场温度</h2>
    <div style="display:flex;align-items:baseline;gap:12px">
      <span class="temp-big" style="color:${tColor}">${fmt(T.temperature)}°</span>
      <span class="temp-level">${tIcon} ${tLabel} · ${tAction}</span>
    </div>
    <div class="temp-bar"><div class="temp-bar-fill" style="width:${T.temperature}%;background:${tColor}"></div></div>
    <div class="temp-detail">
      <span>PE分位 ${fmt(T.components?.pe_score)}°</span><span>PB分位 ${fmt(T.components?.pb_score)}°</span>
      <span>股债性价比 ${fmt(T.components?.erp_score)}°</span><span>成交量 ${fmt(T.components?.volume_score)}°</span>
      <span>情绪 ${fmt(T.components?.sentiment_score)}°</span>
    </div>`;

  if(T.divergence){
    const dCol=T.divergence.level==='一致'?'var(--green)':(T.divergence.level.includes('轻微')?'var(--yellow)':'var(--red)');
    html+=`<div class="divergence" style="border-left:3px solid ${dCol}">🔍 ${T.divergence.level}: ${T.divergence.message}</div>`;
  }
  if(T.market_style&&T.market_style.dominant!=='unknown'){
    html+=`<div class="style-info">🎨 <b>${T.market_style.dominant}</b> · ${T.market_style.detail||''}</div>`;
  }
  html+=`</div>`;

  // === 仓位 ===
  html+=`<div class="card">
    <h2>🎯 仓位建议</h2>
    <div class="alloc-bar">
      <div class="alloc-e" style="width:${eq}%">${eq}% 权益</div>
      <div class="alloc-b" style="width:${100-eq}%">${100-eq}% 固收</div>
    </div>
    <div class="alloc-legend">
      <span>🟦 权益 ≈ ${fmtMoney(totalInvested*eq/100)}</span>
      <span>🟪 固收 ≈ ${fmtMoney(totalInvested*(100-eq)/100)}</span>
    </div>`;
  if(P.has_holdings){
    html+=`<div style="margin-top:12px;font-size:13px;color:var(--dim)">市值 ${fmtMoney(P.total_market_value)} · 盈亏 <span class="${P.total_pnl>=0?'pnl-pos':'pnl-neg'}">${fmtPct(P.total_return_pct)}</span></div>`;
  }else{
    html+=`<div style="margin-top:12px;font-size:13px;color:var(--dim)">暂无持仓 · <code>python src/main.py buy</code> 录入</div>`;
  }
  html+=`</div>`;

  // === 投资计划 ===
  if(PL.funds && PL.funds.length>0){
    html+=`<div class="card full"><h2>📋 投资计划 <span class="sub">— ${PL.name||''} · 起始 ${PL.start_date||''}</span></h2>`;
    const invested=PL.total_invested||0;
    const target=(PL.total_capital||0)-(PL.cash_reserve||0);
    const totalPct=target>0?Math.min(100,invested/target*100):0;
    html+=`<div style="font-size:13px;color:var(--dim);margin-bottom:10px">已投权益 ¥${fmtMoney(invested)} / 目标 ¥${fmtMoney(target)} · 现金弹药 ¥${fmtMoney(PL.cash_reserve||0)}</div>`;
    for(const f of PL.funds){
      const pct=f.progress_pct||0;
      const barW=Math.min(100,pct);
      const hasNext=f.next&&f.next.amount>0;
      html+=`<div style="margin:8px 0">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="font-weight:500">${f.name}</span>
          <span style="color:var(--dim)">¥${fmtMoney(f.invested)}/¥${fmtMoney(f.target)} (${pct}%)${hasNext?` · <span style="color:var(--cyan)">${f.next.note||('下一笔买 ¥'+f.next.amount)}</span>`:''}</span>
        </div>
        <div style="height:6px;background:#21262d;border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${barW}%;background:${pct>=100?'var(--green)':pct>0?'var(--blue)':'#2a2d38'};border-radius:3px;transition:width .6s"></div>
        </div>
      </div>`;
    }
    html+=`</div>`;
  }

  // === 信号 ===
  html+=`<div class="card">
    <h2>📰 市场信号</h2>`;
  if(S.all_clear){
    html+=`<div class="status"><span class="dot dot-green"></span>本周无信号</div>`;
  }else{
    html+=`<div style="font-size:13px;color:var(--dim);margin-bottom:8px">${S.signal_summary||''}</div>`;
    for(const a of(S.alerts||[]).slice(0,4)){
      const cls=a.level==='🔴'?'alert-red':(a.level==='🟡'?'alert-yellow':'alert-info');
      html+=`<div class="alert ${cls}"><b>[${a.category}]</b> ${a.title}<br><span style="color:var(--dim);font-size:12px">${a.detail||''}</span></div>`;
    }
  }
  html+=`<div style="margin-top:10px;font-size:12px;color:var(--dim)">只显示能影响决策的信号</div></div>`;

  // ===== 质量筛选池 — 按基金类型分组，每类5只 =====
  html+=`<div class="card full"><h2>🔍 质量筛选池 <span class="sub">— 不推荐"买哪只"，只排除有坑的</span></h2>`;

  const funds=F.funds||[];
  if(funds.length===0){
    html+=`<div class="empty">暂无基金数据 · 运行 python src/main.py nav && python src/main.py enrich</div>`;
  }else{
    const summary=F.summary||{};
    html+=`<div class="summary-bar"><span>共${summary.total||0}只</span>`;
    for(const[k,v]of Object.entries(summary.by_risk||{}))html+=`<span>${k} ${v}只</span>`;
    html+=`<span>均费率${fmt(summary.avg_fee,2)}%</span></div>`;

    // 按具体基金类型分组
    const groups={};
    for(const f of funds){
      const ft=f.type||'其他';
      if(!groups[ft])groups[ft]=[];
      groups[ft].push(f);
    }
    // 组内排序: 稳健优先
    for(const g of Object.values(groups)){
      g.sort((a,b)=>{
        const ra=a.risk||'', rb=b.risk||'';
        if(ra.includes('稳健')&&!rb.includes('稳健'))return -1;
        if(!ra.includes('稳健')&&rb.includes('稳健'))return 1;
        return 0;
      });
    }
    // 按数量排序: 基金多的类型在前
    const sortedTypes=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);

    html+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:10px;margin-top:8px">`;
    for(const bt of sortedTypes){
      const gfunds=groups[bt];
      const show=gfunds.slice(0,5);
      const label=show.length<gfunds.length ? `共${gfunds.length}只 · 展示前5` : `共${gfunds.length}只`;

      html+=`<div style="background:#13151d;border-radius:8px;padding:10px 14px;border:1px solid var(--border)">
        <div style="font-size:13px;font-weight:600;color:var(--cyan);margin-bottom:6px">${bt} <span style="color:var(--dim);font-weight:400">${label}</span></div>`;

      for(const f of show){
        const navs=f.nav_trend||[];
        const mom=f.momentum_3m;
        const momC=mom>25?'var(--red)':(mom>10?'var(--yellow)':'var(--dim)');
        const dd=f.max_dd_1y||0;
        const ddC=dd>30?'var(--red)':(dd>20?'var(--yellow)':'var(--dim)');
        const trendC=mom>0?'var(--green)':'var(--red)';
        const name=f.name||f.code;
        const riskBadge=f.risk||'';
        const badgeCls=riskBadge.includes('稳健')?'b-green':(riskBadge.includes('注意')?'b-yellow':'b-red');

        html+=`<div class="fund-row" style="grid-template-columns:68px 1fr 160px;padding:3px 0;font-size:12px">
          <span>
            <span class="fund-code">${f.code}</span>
            <span class="badge ${badgeCls}" style="font-size:10px;margin-left:2px">${riskBadge.replace('🟢 ','').replace('🟡 ','').replace('🔴 ','')}</span>
          </span>
          <span class="fund-name" title="${name}" style="font-size:12px">${name.length>22?name.substring(0,22)+'…':name}</span>
          <span class="fund-meta" style="font-size:11px">
            <span class="sparkline">${sparkSVG(navs,trendC)}</span>
            <span class="val" style="color:${momC}">${(mom??0)>=0?'+':''}${fmt(mom,1)}%</span>
            <span style="min-width:30px;text-align:center">回撤<span style="color:${ddC}">${fmt(dd,0)}%</span></span>
          </span>
        </div>`;
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  }
  html+=`</div>`;

  // === 板块排名 (异步加载) ===
  html += `<div class="card full" id="sector-card"><h2>📊 行业板块排名 <span class="sub">— 31个申万一级行业 · 动量+趋势+风险综合</span></h2><div class="loading"><span class="spinner"></span>板块数据加载中...</div></div>`;

  // === 调仓建议 ===
  const RB = d.rebalance || {};
  if(RB.instructions && RB.instructions.length>0){
    const summary = RB.summary || {};
    html += `<div class="card full"><h2>🔄 调仓建议 <span class="sub">— 当前 vs 目标</span></h2>`;
    html += `<div style="font-size:14px;font-weight:600;margin-bottom:8px;color:${RB.need_rebalance?'var(--yellow)':'var(--green)'}">${summary.verdict||''}</div>`;
    html += `<div style="font-size:12px;color:var(--dim);margin-bottom:12px">${summary.detail||''} · 当前权益${fmt(RB.current_equity_pct)}% → 目标${fmt(RB.target_equity_pct)}%</div>`;

    for(const inst of RB.instructions.slice(0,4)){
      const icon={'卖出':'🔴','买入':'🟢','持有':'⚪'};
      const actColor={'卖出':'var(--red)','买入':'var(--green)','持有':'var(--dim)'};
      html += `<div class="alert alert-info" style="margin:8px 0;border-left-color:${actColor[inst.action]||'var(--blue)'}">
        <b>${icon[inst.action]||'•'} [${inst.action}] ${inst.fund_code} ${(inst.fund_name||'').substring(0,25)}</b>
        <span style="float:right;font-weight:600">¥${(inst.amount||0).toLocaleString()}</span>
        <br><span style="color:var(--dim);font-size:12px">${inst.reason||''}</span>
      </div>`;
    }
    html += `<div style="margin-top:8px;font-size:11px;color:var(--dim)">⚠️ 操作前确认持有天数 — 不满7天有1.5%惩罚赎回费</div>`;
    html += `</div>`;
  }

  // === 持仓 ===
  if(P.has_holdings){
    html+=`<div class="card full">
      <h2>📋 持仓</h2>
      <div style="font-size:13px;color:var(--dim);margin-bottom:8px">投入 ${fmtMoney(P.total_invested)} · 市值 ${fmtMoney(P.total_market_value)} · <span class="${P.total_pnl>=0?'pnl-pos':'pnl-neg'}">${fmtPct(P.total_return_pct)}</span></div>`;
    for(const h of(P.holdings||[])){
      html+=`<div class="fund-row">
        <span class="fund-code">${h.code}</span>
        <span class="fund-name">${h.name||h.code}</span>
        <span class="fund-meta"><span class="val">${fmtMoney(h.current_value)}</span> <span class="${h.pnl>=0?'pnl-pos':'pnl-neg'}">${fmtPct(h.pnl_pct)}</span> · ${h.days_held}天</span></div>`;
    }
    html+=`</div>`;
  }

  html+='</div>';
  document.getElementById('app').innerHTML=html;
}
loadAll();
setTimeout(loadSectors, 500);

async function loadSectors(retries=3){
  const card = document.getElementById('sector-card');
  for(let attempt=0; attempt<retries; attempt++){
    try{
      const r = await fetch('/api/sectors');
      const j = await r.json();
      if(!j.ok){throw new Error(j.error||'fail');}

      const sectors = j.data.sectors || [];
      if(sectors.length===0){throw new Error('empty');}

      const momentum = j.data.momentum_leaders || [];
      const value = j.data.value_candidates || [];
      const src = j.source||'';
      const age = j.data.cached_at||'';

    // Sort: top 10 + bottom 5
    const top10 = sectors.slice(0,10);
    const bottom5 = sectors.slice(-5);

    let html = '<h2>📊 行业板块排名 <span class="sub">— 31个申万一级行业 · 动量+趋势+风险</span></h2>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">';

    // Left: Top10 leaderboard
    html += '<div><div style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:8px">🔥 综合排名 Top 10</div>';
    for(const s of top10){
      const barW = Math.max(4, (s.score+1.5)*40); // score range ~ -1.5 to +1.5 → 0-120px
      const barC = s.score>0.5?'var(--green)':s.score>0?'var(--dim)':'var(--yellow)';
      const momC = s.ret_1m>0?'var(--green)':'var(--red)';
      html += `<div class="fund-row" style="grid-template-columns:28px 1fr 180px">
        <span style="font-size:12px;color:var(--dim)">#${s.rank}</span>
        <span class="fund-name">${s.name}</span>
        <span class="fund-meta">
          <span style="width:${barW}px;height:4px;background:${barC};border-radius:2px;display:inline-block;margin-right:6px"></span>
          <span style="color:${momC};min-width:48px;text-align:right;font-weight:500">${(s.ret_1m??0)>=0?'+':''}${(s.ret_1m??0).toFixed(1)}%</span>
          <span style="font-size:11px;color:var(--dim);min-width:44px;text-align:right">3月${(s.ret_3m??0)>=0?'+':''}${(s.ret_3m??0).toFixed(0)}%</span>
        </span>
      </div>`;
    }
    html += '</div>';

    // Right: Bottom5 + 推荐
    html += '<div>';
    html += '<div style="font-size:13px;font-weight:600;color:var(--red);margin-bottom:8px">📉 排名靠后 (值得注意)</div>';
    for(const s of bottom5){
      const momC = s.ret_1m>0?'var(--green)':'var(--red)';
      html += `<div class="fund-row" style="grid-template-columns:28px 1fr 120px">
        <span style="font-size:12px;color:var(--dim)">#${s.rank}</span>
        <span class="fund-name">${s.name}</span>
        <span class="fund-meta">
          <span style="color:${momC};min-width:48px;text-align:right;font-weight:500">${(s.ret_1m??0)>=0?'+':''}${(s.ret_1m??0).toFixed(1)}%</span>
          <span style="font-size:11px;color:var(--dim);min-width:36px;text-align:right">波${(s.volatility??0).toFixed(0)}%</span>
        </span>
      </div>`;
    }

    // Momentum leaders
    if(momentum.length>0){
      html += '<div style="font-size:13px;font-weight:600;color:var(--cyan);margin:12px 0 6px">🚀 动量领涨</div>';
      for(const s of momentum.slice(0,3)){
        html += `<div class="fund-row" style="grid-template-columns:1fr 120px">
          <span class="fund-name">${s.name}</span>
          <span class="fund-meta"><span style="color:var(--green);font-weight:500">近1月${(s.ret_1m??0)>=0?'+':''}${(s.ret_1m??0).toFixed(1)}%</span> 3月${(s.ret_3m??0)>=0?'+':''}${(s.ret_3m??0).toFixed(1)}%</span>
        </div>`;
      }
    }

    // Value candidates
    if(value.length>0){
      html += '<div style="font-size:13px;font-weight:600;color:var(--purple);margin:12px 0 6px">💧 超跌候选 (逆向)</div>';
      for(const s of value.slice(0,3)){
        html += `<div class="fund-row" style="grid-template-columns:1fr 120px">
          <span class="fund-name">${s.name}</span>
          <span class="fund-meta"><span style="color:var(--red);font-weight:500">近1月${(s.ret_1m??0)>=0?'+':''}${(s.ret_1m??0).toFixed(1)}%</span> 回撤${(s.max_dd??0).toFixed(0)}%</span>
        </div>`;
      }
    }

    html += '</div></div>';
    html += '<div style="font-size:11px;color:var(--dim);margin-top:10px">评分 = 动量40% + 趋势强度30% + 风险调整30%' + (age?' · 缓存于 '+age:'') + '</div>';

    card.innerHTML = html;
    return;  // 成功，退出
  }catch(e){
    if(attempt < retries-1){
      // 预计算可能还没完成，等几秒重试
      card.innerHTML='<h2>📊 行业板块排名 <span class="sub">— 31个申万一级行业</span></h2><div class="loading"><span class="spinner"></span>等待数据就绪... ('+(attempt+2)+'/'+retries+')</div>';
      await new Promise(r=>setTimeout(r,3000));
    }else{
      card.innerHTML='<h2>📊 行业板块排名</h2><div class="empty">板块数据加载失败 · 请刷新重试</div>';
    }
  }
  }
}
</script>
</body>
</html>
